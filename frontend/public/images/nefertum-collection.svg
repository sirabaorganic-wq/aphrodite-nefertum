<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bgn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0805"/>
      <stop offset="100%" style="stop-color:#1a1510"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#C6A972;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0a0805;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgn)"/>
  <rect width="1200" height="600" fill="url(#glow)"/>
  <!-- Egyptian-inspired lotus -->
  <g transform="translate(600,260)" opacity="0.2">
    <ellipse cx="0" cy="0" rx="100" ry="35" fill="#C6A972" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="100" ry="35" fill="#C6A972" transform="rotate(45)"/>
    <ellipse cx="0" cy="0" rx="100" ry="35" fill="#C6A972" transform="rotate(90)"/>
    <ellipse cx="0" cy="0" rx="100" ry="35" fill="#C6A972" transform="rotate(135)"/>
    <circle cx="0" cy="0" r="25" fill="#D4B896"/>
  </g>
  <text x="600" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#C6A972" letter-spacing="8">NEFERTUM</text>
  <text x="600" y="415" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#A89968" letter-spacing="4">COLLECTION</text>
  <line x1="500" y1="445" x2="700" y2="445" stroke="#C6A972" stroke-width="1" opacity="0.3"/>
</svg>
