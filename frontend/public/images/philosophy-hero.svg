<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bgp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0805"/>
      <stop offset="50%" style="stop-color:#0f0d0a"/>
      <stop offset="100%" style="stop-color:#1a1510"/>
    </linearGradient>
    <radialGradient id="glowp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#C6A972;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#0a0805;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#bgp)"/>
  <rect width="1600" height="700" fill="url(#glowp)"/>
  <!-- Sacred geometry pattern -->
  <g transform="translate(800,300)" opacity="0.1">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#C6A972" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="#C6A972" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#C6A972" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#D4B896" stroke-width="1"/>
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#C6A972" stroke-width="0.3"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#C6A972" stroke-width="0.3"/>
    <line x1="-85" y1="-85" x2="85" y2="85" stroke="#C6A972" stroke-width="0.3"/>
    <line x1="85" y1="-85" x2="-85" y2="85" stroke="#C6A972" stroke-width="0.3"/>
  </g>
  <text x="800" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#C6A972" letter-spacing="6">OUR PHILOSOPHY</text>
  <text x="800" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#A89968" letter-spacing="3">PERFUME AS RITUAL, NOT JUST SCENT</text>
  <line x1="700" y1="540" x2="900" y2="540" stroke="#C6A972" stroke-width="1" opacity="0.25"/>
</svg>
