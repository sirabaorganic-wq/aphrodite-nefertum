<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0805"/>
      <stop offset="100%" style="stop-color:#1a1510"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B7355"/>
      <stop offset="50%" style="stop-color:#C6A972"/>
      <stop offset="100%" style="stop-color:#8B7355"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Decorative lotus flower -->
  <g transform="translate(400,260)" opacity="0.15">
    <ellipse cx="0" cy="0" rx="80" ry="30" fill="#C6A972" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="80" ry="30" fill="#C6A972" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="80" ry="30" fill="#C6A972" transform="rotate(120)"/>
    <circle cx="0" cy="0" r="20" fill="#D4B896"/>
  </g>
  <!-- Title -->
  <text x="400" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#C6A972" letter-spacing="4">THE MYTH OF NEFERTUM</text>
  <text x="400" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#A89968" letter-spacing="2">AND THE SACRED LOTUS</text>
  <!-- Decorative line -->
  <line x1="320" y1="420" x2="480" y2="420" stroke="url(#gold)" stroke-width="1" opacity="0.4"/>
</svg>
